<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Van Gone Broke</title>
<style>
  html, body { margin: 0; height: 100%; background: #faf8f5; color: #1a1014; font-family: -apple-system, system-ui, sans-serif; }
  main { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
         padding: max(24px, env(safe-area-inset-top)) 28px max(24px, env(safe-area-inset-bottom)); }
  .mark { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: 15px; letter-spacing: .5em; margin-right: -.5em; color: #b07880; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 400; font-size: 34px; line-height: 1.15; margin: 22px 0 12px; }
  p { font-size: 15px; line-height: 1.6; font-weight: 300; color: #6b6266; max-width: 300px; margin: 0; }
  button { margin-top: 28px; border: 0; background: #1a1014; color: #faf8f5; font: inherit; font-size: 12px; font-weight: 500; letter-spacing: .3em;
           text-transform: uppercase; padding: 16px 26px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <span class="mark">VGB</span>
  <h1>The studio’s out of signal</h1>
  <p>We can’t reach the gallery right now. Find a bit of Wi-Fi or data and the art will be right here waiting.</p>
  <button type="button" onclick="location.replace('https://faradaycage.xyz' + (location.hash.slice(1) || '/'))">Try again</button>
</main>
</body>
</html>
